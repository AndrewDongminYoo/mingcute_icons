name: flutter_mingcute
description: A MingCute icon library package for Flutter applications. Carefully designed icons in fill and line styles.
version: 3.0.2+1
homepage: https://www.mingcute.com
repository: https://github.com/AndrewDongminYoo/mingcute_icons

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  merry: ^2.5.0
  very_good_analysis: ^11.0.0

scripts:
  update-icons:
    (description): Upgrade @mingcute/font and @mingcute/svg, convert font assets, and regenerate lib/flutter_mingcute.dart.
    (scripts):
      - bash tool/update_icons.sh

flutter:
  fonts:
    - family: Mingcute Core Filled
      fonts:
        - asset: assets/mingcute.ttf
    - family: Mingcute Core Regular
      fonts:
        - asset: assets/mingcute_line.ttf

import_sorter:
  emojis: true
