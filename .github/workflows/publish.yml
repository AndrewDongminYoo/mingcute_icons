name: Publish to pub.dev

# Publishes the package when a release tag lands (tag-release.yml creates one
# after each version bump on main). Pub.dev only accepts automated publishing
# from runs triggered by pushing a tag that matches the pattern configured in
# the package's admin settings, so this workflow has no other triggers.
on:
  push:
    tags:
      # Upstream versions can carry a prerelease suffix (e.g. v0.0.46-24), so
      # match beyond the plain vX.Y.Z form.
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write # required for the pub.dev OIDC token exchange
    # Reusable workflow maintained by the Dart team. It installs a Flutter SDK
    # alongside Dart, so Flutter packages publish the same way.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
