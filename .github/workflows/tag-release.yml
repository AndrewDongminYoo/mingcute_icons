name: Tag release

# When a version bump lands on main (the auto-update PR is merged, or a manual
# release commit is pushed), create the matching vX.Y.Z git tag so that git
# dependencies can pin to it.
on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml

permissions:
  contents: write

# Run Node-based actions on Node 24 to silence the Node 20 deprecation notice.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create tag if missing
        env:
          # Tags created with the default GITHUB_TOKEN cannot trigger other
          # workflows. Prefer RELEASE_TOKEN when configured; otherwise the tag
          # is created but publishing still needs a manually pushed tag.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          tag="v${version}"
          # Query the GitHub API directly: a shallow checkout cannot see
          # existing tags, so a local rev-parse would wrongly try to recreate one.
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin; nothing to do."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}"
          echo "Created ${tag}."
