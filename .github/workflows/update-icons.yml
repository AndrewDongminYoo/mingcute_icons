name: Update MingCute icons

# The daily schedule compares pubspec.yaml against the mingcute_icon release
# list and no-ops when already current. When upstream is ahead, the icon set is
# regenerated for the *next* release only -- one PR per upstream version, so the
# published Dart versions stay 1:1 with mingcute_icon -- and the following
# release waits until that PR lands. Still dispatchable on demand.
on:
  workflow_dispatch:
  schedule:
    # Every 4 hours -- 6 runs a day. Each merged PR publishes one version, and
    # pub.dev rate-limits `package-published` per package at 3 per 2 minutes,
    # 6 per hour and 12 per day. A faster cadence would still merge and tag
    # fine, so main would keep advancing while publish.yml alone failed.
    - cron: "0 */4 * * *"

permissions:
  contents: write
  pull-requests: write

# Run Node-based actions on Node 24 to silence the Node 20 deprecation notice.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick the next mingcute_icon release to mirror
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          # A package-side hotfix (e.g. 1.24.0+1) still tracks the same upstream
          # release; strip the build number so it doesn't reopen the update PR daily.
          current="${current%%+*}"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          # One update PR at a time. An open PR is the head of the queue; opening
          # the next one before it lands would release versions out of order.
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/mingcute_icon-"))] | length')"
          if [ "$open" != 0 ]; then
            echo "An icon update PR is already open; waiting for it to land."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Advance one release at a time rather than jumping to `latest`, so no
          # upstream version is skipped. `npm view` lists versions in semver
          # order, so the next release is the entry after the current one.
          # A `current` that upstream unpublished has no position to advance
          # from; fall back to latest instead of stalling the mirror forever.
          next="$(npm view mingcute_icon versions --json \
            | jq -r --arg cur "$current" \
              'index($cur) as $i | if $i == null then .[-1] else (.[$i + 1] // empty) end')"
          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "Already on mingcute_icon@$current; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "mingcute_icon@$next available (current: $current)."
            echo "next=$next" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Flutter
        if: steps.check.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate icon set
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.next }}
        run: |
          flutter pub get
          bash tool/update_icons.sh "$NEW_VERSION"

      - name: Bump version and update changelog
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.next }}
        run: |
          # Keep the package version in lockstep with mingcute_icon.
          sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml

          # Derive added / removed icon names from the regenerated Dart file.
          ADDED="$(git diff -- lib/flutter_mingcute.dart \
            | grep -E '^\+[[:space:]]+static const IconData' \
            | sed -E 's/.*IconData[[:space:]]+([A-Za-z0-9]+).*/\1/' | sort -u || true)"
          REMOVED="$(git diff -- lib/flutter_mingcute.dart \
            | grep -E '^-[[:space:]]+static const IconData' \
            | sed -E 's/.*IconData[[:space:]]+([A-Za-z0-9]+).*/\1/' | sort -u || true)"
          export ADDED REMOVED

          python3 - "$NEW_VERSION" <<'PY'
          import os, sys, datetime

          version = sys.argv[1]
          date = datetime.date.today().isoformat()
          added = [n for n in os.environ.get("ADDED", "").split() if n]
          removed = [n for n in os.environ.get("REMOVED", "").split() if n]

          def names(items):
              return ", ".join(f"`{n}`" for n in items)

          lines = [f"## {version} - {date}", "", "### Added", "",
                   f"- Updated icon set to mingcute_icon@{version}."]
          if added:
              lines.append(f"- New icons: {names(added)}.")
          if removed:
              lines += ["", "### Removed", "", f"- Removed icons: {names(removed)}."]
          entry = "\n".join(lines) + "\n\n"

          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()

          header = "# Changelog\n\n"
          if content.startswith(header):
              content = header + entry + content[len(header):]
          else:
              content = entry + content
          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(content)

          # Expose a short summary for the PR body.
          summary = []
          if added:
              summary.append(f"**Added ({len(added)}):** {names(added)}")
          if removed:
              summary.append(f"**Removed ({len(removed)}):** {names(removed)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("PR_SUMMARY<<EOF\n" + ("\n\n".join(summary) or "No icon constants changed.") + "\nEOF\n")
          PY

      - name: Format the regenerated files
        if: steps.check.outputs.changed == 'true'
        run: |
          # The vendored CSS and the generated changelog entry land unformatted,
          # and CI has no trunk-fmt-pre-commit hook, so run the repo's own
          # formatter here instead. --all skips trunk's changed-file detection,
          # which needs an upstream ref this shallow checkout lacks. Only the
          # launcher comes from the network; .trunk/trunk.yaml pins the CLI.
          curl https://get.trunk.io -fsSL | bash -s -- -y
          trunk fmt --all

      - name: Verify the package still analyzes
        if: steps.check.outputs.changed == 'true'
        run: flutter analyze

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: flutter test

      - name: Open pull request
        id: pr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: chore/mingcute_icon-${{ steps.check.outputs.next }}
          commit-message: "feat(icons): update icon set to mingcute_icon@${{ steps.check.outputs.next }}"
          title: "feat(icons): update icon set to mingcute_icon@${{ steps.check.outputs.next }}"
          body: |
            Automated regeneration triggered by a new mingcute_icon release.

            - mingcute_icon: `${{ steps.check.outputs.current }}` → `${{ steps.check.outputs.next }}`

            ${{ env.PR_SUMMARY }}

            Generated by `.github/workflows/update-icons.yml`.
          labels: dependencies, icons
          delete-branch: true

      - name: Merge the pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          # RELEASE_TOKEN only -- never github.token. A merge pushed with the
          # default token cannot trigger tag-release.yml, so the version would
          # land on main untagged and never reach pub.dev. Without the secret
          # the PR is left open for a manual merge, which is the current flow.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_TOKEN is not configured; leaving PR #${PR} for a manual merge."
            exit 0
          fi
          # A plain merge, not --auto: this repo has no pull_request-triggered
          # workflow, so auto-merge would have no check to wait for. The steps
          # above are the gate. Add --auto once PR-time CI exists.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
